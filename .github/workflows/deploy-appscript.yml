name: Deploy Google Apps Script (CLASP)

on:
  push:
    branches:
      - main
    paths:
      - 'google-apps-script/**'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-appscript.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Setup .clasprc.json Credentials
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const creds = process.env.CLASPRC_JSON;
            if (!creds || !creds.trim()) {
              console.error('ERROR: CLASPRC_JSON secret is empty!');
              process.exit(1);
            }
            const targetPath = path.join(os.homedir(), '.clasprc.json');
            fs.writeFileSync(targetPath, creds.trim(), 'utf8');
            console.log('Successfully written ~/.clasprc.json');
          "
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Configure .clasp.json Script ID
        run: |
          node -e "
            const fs = require('fs');
            const scriptId = process.env.SCRIPT_ID || '1yuxhEVGXHL3Tjr9VF6y9UdxLG8VoR-3grOH5U4YIQUdYJB0LFy8i-zW7';
            const claspConfig = {
              scriptId: scriptId.trim(),
              rootDir: './google-apps-script'
            };
            fs.writeFileSync('.clasp.json', JSON.stringify(claspConfig, null, 2));
            console.log('Configured .clasp.json with Script ID:', scriptId);
          "
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}

      - name: Push to Google Apps Script
        run: clasp push --force

      - name: Deploy Web App Version
        run: |
          if [ -n "${{ secrets.DEPLOYMENT_ID }}" ]; then
            echo "Deploying to existing Deployment ID..."
            clasp deploy --deploymentId "${{ secrets.DEPLOYMENT_ID }}" --description "GitHub Actions CI/CD: ${{ github.sha }}"
          else
            echo "Creating new deployment version..."
            clasp deploy --description "GitHub Actions CI/CD: ${{ github.sha }}"
          fi
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
