  <circle cx="256" cy="256" r="140" stroke="#334155" stroke-width="4" stroke-dasharray="10 15" fill="none" opacity="0.5"/>

  <!-- Center Vinyl/Speaker Ring -->
  <circle cx="256" cy="256" r="95" fill="#131c31" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Music Note / Soundwave glyph -->
  <path d="M220 330 C220 350 200 365 175 365 C150 365 130 350 130 330 C130 310 150 295 175 295 C190 295 205 300 214 310 L214 185 C214 175 222 168 232 169 L332 184 C340 185 346 192 346 200 L346 290 C346 310 326 325 301 325 C276 325 256 310 256 290 C256 270 276 255 301 255 C316 255 330 260 339 270 L339 220 L220 202 Z" fill="url(#glowGrad)"/>

  <!-- Wave bars -->
  <rect x="380" y="220" width="10" height="72" rx="5" fill="#6366f1" opacity="0.9"/>
  <rect x="400" y="200" width="10" height="112" rx="5" fill="#818cf8" opacity="0.8"/>
  <rect x="420" y="235" width="10" height="42" rx="5" fill="#4f46e5" opacity="0.7"/>

  <rect x="100" y="220" width="10" height="72" rx="5" fill="#6366f1" opacity="0.9"/>
  <rect x="80" y="200" width="10" height="112" rx="5" fill="#818cf8" opacity="0.8"/>
  <rect x="60" y="235" width="10" height="42" rx="5" fill="#4f46e5" opacity="0.7"/>
