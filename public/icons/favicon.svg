<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate matching the app's dark elements -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Inner Glow & Soundwave Accent -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle Premium Highlight -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border Accent -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Minimalist Vinyl Grooves -->
  <circle cx="256" cy="256" r="185" stroke="url(#ringGrad)" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="145" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="12 8" fill="none" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="105" stroke="url(#ringGrad)" stroke-width="3" fill="none"/>

  <!-- Center Core Ring -->
  <circle cx="256" cy="256" r="68" fill="#090d16" stroke="#475569" stroke-width="3.5"/>

  <!-- Modern Stylized Music Note & Sound Wave in Crisp Titanium White -->
  <g fill="url(#accentGlow)">
    <!-- Note Head 1 (Left) -->
    <circle cx="205" cy="310" r="32"/>
    <!-- Note Head 2 (Right) -->
    <circle cx="305" cy="275" r="32"/>

    <!-- Left Stem -->
    <rect x="225" y="155" width="14" height="155" rx="7"/>
    <!-- Right Stem -->
    <rect x="325" y="125" width="14" height="150" rx="7"/>

    <!-- Top Connecting Beam -->
    <path d="M225 155 L339 125 L339 155 L225 185 Z"/>
  </g>

  <!-- Left Soundwave Bars (Minimalist Slate) -->
  <rect x="80" y="226" width="8" height="60" rx="4" fill="#64748b" opacity="0.8"/>
  <rect x="98" y="200" width="8" height="112" rx="4" fill="#94a3b8" opacity="0.9"/>
  <rect x="116" y="240" width="8" height="32" rx="4" fill="#475569" opacity="0.7"/>

  <!-- Right Soundwave Bars (Minimalist Slate) -->
  <rect x="388" y="240" width="8" height="32" rx="4" fill="#475569" opacity="0.7"/>
  <rect x="406" y="200" width="8" height="112" rx="4" fill="#94a3b8" opacity="0.9"/>
  <rect x="424" y="226" width="8" height="60" rx="4" fill="#64748b" opacity="0.8"/>

  <!-- Center Vinyl Dot -->
  <circle cx="256" cy="256" r="14" fill="#f8fafc"/>
</svg>
